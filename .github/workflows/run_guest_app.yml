name: Run a guest app

# Manually-triggered compatibility triage: builds touchHLE for Linux, runs a
# guest app under it for a bounded time on a headless runner, and uploads the
# emulator log.
#
# This exists so a compatibility fix can be checked without a device. The
# `build_ref` input builds a different revision of the emulator from the one
# the workflow file came from, which is what makes a before/after comparison
# of the same app possible.
#
# No app is named here and none is committed: the link is a dispatch input.
# Only use apps you obtained legally.

on:
  # GitHub will only let a workflow be dispatched once it has seen a run of
  # it, and on a branch other than the default one a push is the only way to
  # get one. Changing this file therefore starts a run that immediately
  # skips its job, because no app was named.
  push:
    paths:
      - '.github/workflows/run_guest_app.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: Direct link to a decrypted .ipa, or an archive.org item page
        type: string
        required: false
      log_run_id:
        description: Print the log of an earlier run of this workflow, run nothing
        type: string
        required: false
      build_ref:
        description: Revision of touchHLE to build (defaults to the dispatch ref)
        type: string
        required: false
      run_seconds:
        description: How long to let the app run before stopping it (seconds)
        type: string
        required: false
        default: "120"
      extra_args:
        description: Extra arguments for touchHLE (e.g. "--scale-hack=2")
        type: string
        required: false
        default: ""
      disassemble:
        description: Guest addresses from the log to disassemble, comma-separated hex
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  run-guest-app:
    name: Run on Linux
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.log_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          ref: ${{ inputs.build_ref }}

      - name: Report the revision under test
        run: git log -1 --format='%H %s'

      - name: Install Linux build and runtime dependencies
        # SDL2 and openal-soft are built from source, so the development
        # headers for the backends they detect must be available. `xvfb`
        # provides a headless X server and `libgl1-mesa-dri` the llvmpipe
        # software renderer, since the runner has no GPU.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dri \
            xvfb

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download and extract Boost
        run: |
          curl -L --retry 4 --retry-delay 2 -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          mkdir -p vendor
          tar xzf boost_1_81_0.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build touchHLE
        run: cargo build --release

      # An app is often a couple of gigabytes, and triage means running the
      # same one over and over. Keep it between runs, both to save the twenty
      # minutes and to stop pulling it from wherever it is hosted every time.
      - name: Identify the app
        id: app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          set -eu
          key=$(printf '%s' "$APP_URL" | sha256sum | cut -c1-32)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Try to get a cached copy of the app
        id: cache-app
        uses: actions/cache@main
        with:
          path: downloaded_app
          key: guest-app-${{ steps.app.outputs.key }}

      - if: ${{ steps.cache-app.outputs.cache-hit != 'true' }}
        name: Download the app
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          set -euo pipefail
          mkdir -p downloaded_app
          url=$APP_URL
          # An archive.org item page is not a file. Ask the metadata API which
          # files the item holds and take the first .ipa.
          case "$url" in
            *archive.org/details/*)
              identifier=${url##*/details/}
              identifier=${identifier%%/*}
              identifier=${identifier%%\?*}
              echo "Resolving archive.org item $identifier"
              curl -fL --retry 4 --retry-delay 2 \
                -o metadata.json "https://archive.org/metadata/$identifier"
              url=$(python3 -c 'import json, sys, urllib.parse; files = json.load(open("metadata.json")).get("files", []); names = [f["name"] for f in files if f.get("name", "").lower().endswith(".ipa")]; sys.exit("No .ipa in the item file list") if not names else None; print("https://archive.org/download/" + sys.argv[1] + "/" + urllib.parse.quote(names[0]))' "$identifier")
              ;;
          esac
          echo "Downloading $url"
          # An app can be a couple of gigabytes, and a transfer that stalls
          # part-way through would otherwise hold the job until it times out.
          # Give up on anything slower than 8 KiB/s for a minute and retry.
          curl -fL --retry 6 --retry-delay 5 --retry-all-errors \
            --speed-limit 8192 --speed-time 60 \
            -o downloaded_app/app.ipa "$url"
          ls -lh downloaded_app/app.ipa

      - name: Inspect the app bundle
        run: ./target/release/touchHLE downloaded_app/app.ipa --info

      - name: Run the app under touchHLE
        shell: bash
        env:
          RUN_SECONDS: ${{ inputs.run_seconds }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -uo pipefail
          xvfb-run -a --server-args="-screen 0 640x960x24" \
            ./dev-scripts/ci-run-app.sh ./target/release/touchHLE \
            "${RUN_SECONDS}" downloaded_app/app.ipa ${EXTRA_ARGS}

      # An address in the log — the LR of an ignored UndefinedInstruction, say
      # — says nothing on its own. This shows the guest instructions around it.
      - name: Disassemble the guest around the reported addresses
        if: ${{ always() && inputs.disassemble != '' }}
        env:
          ADDRESSES: ${{ inputs.disassemble }}
        run: |
          set -eu
          case "$ADDRESSES" in
            *[!0-9a-fA-FxX,\ ]*)
              echo "Addresses must be hexadecimal, separated by commas." >&2
              exit 2
              ;;
          esac
          python3 -m pip install --quiet capstone \
            || python3 -m pip install --quiet --break-system-packages capstone
          # Into a file as well as the log: the job's own output is buried
          # under the emulator's, and the report job prints this.
          # shellcheck disable=SC2046
          python3 dev-scripts/disassemble-guest.py downloaded_app/app.ipa \
            $(printf '%s' "$ADDRESSES" | tr ',' ' ') | tee disassembly.txt

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: guest_app_run_log
          path: |
            run.log
            disassembly.txt
          if-no-files-found: ignore

  # An artifact has to be downloaded to be read, which is awkward when all you
  # want is to see what the emulator said. This job prints the log into the
  # workflow's own output, either for the run that just happened or, with
  # `log_run_id`, for an earlier one.
  report:
    name: Report the log
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: run-guest-app
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fetch the log
        uses: actions/download-artifact@main
        with:
          name: guest_app_run_log
          run-id: ${{ inputs.log_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Print the log
        run: |
          set -eu
          lines=$(wc -l < run.log)
          echo "run.log: $lines lines"
          echo
          if [ "$lines" -le 900 ]; then
            echo "===== full log ====="
            cat run.log
          else
            echo "===== first 200 lines ====="
            head -200 run.log
            echo "===== last 300 lines ====="
            tail -300 run.log
          fi
          echo
          # These two go last, so that they are what you see first when
          # reading the job output from the end.
          echo "===== what led up to the first null-page access ====="
          first=$(grep -an 'NULL-PAGE' run.log | head -1 | cut -d: -f1 || true)
          if [ -n "${first:-}" ]; then
            start=1
            if [ "$first" -gt 80 ]; then start=$((first - 80)); fi
            sed -n "${start},${first}p" run.log
          else
            echo "(none)"
          fi
          echo
          echo "===== warnings, with addresses and counters folded together ====="
          grep -aE 'Warning|TODO|nimplemented|not implemented|error|Error|missing' run.log \
            | sed -E 's/0x[0-9a-fA-F]+/0xX/g; s/[0-9]+/N/g' \
            | sort | uniq -c | sort -rn | head -60 || true
          echo
          # The table above folds addresses together, which is what makes it
          # readable and also what makes it useless for looking anything up.
          # These are the addresses themselves, ready for
          # dev-scripts/disassemble-guest.py.
          echo "===== guest addresses the emulator named ====="
          grep -aoE '(called from|return to LR \(|UndefinedInstruction at) ?0x[0-9a-fA-F]+' run.log \
            | sort -u || true
          if [ -f disassembly.txt ]; then
            echo
            echo "===== disassembly around the requested addresses ====="
            cat disassembly.txt
          fi
