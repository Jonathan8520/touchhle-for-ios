name: Run a guest app

# Manually-triggered compatibility triage: builds touchHLE for Linux, runs a
# guest app under it for a bounded time on a headless runner, and uploads the
# emulator log.
#
# This exists so a compatibility fix can be checked without a device. The
# `build_ref` input builds a different revision of the emulator from the one
# the workflow file came from, which is what makes a before/after comparison
# of the same app possible.
#
# No app is named here and none is committed: the link is a dispatch input.
# Only use apps you obtained legally.

on:
  # GitHub will only let a workflow be dispatched once it has seen a run of
  # it, and on a branch other than the default one a push is the only way to
  # get one. Changing this file therefore starts a run that immediately
  # skips its job, because no app was named.
  push:
    paths:
      - '.github/workflows/run_guest_app.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: Direct link to a decrypted .ipa, or an archive.org item page
        type: string
        required: false
      app_cache_key:
        description: Reuse an app already cached by an earlier run, instead of app_url
        type: string
        required: false
      log_run_id:
        description: Print the log of an earlier run of this workflow, run nothing
        type: string
        required: false
      build_ref:
        description: Revision of touchHLE to build (defaults to the dispatch ref)
        type: string
        required: false
      run_seconds:
        description: How long to let the app run before stopping it (seconds)
        type: string
        required: false
        default: "120"
      extra_args:
        description: Extra arguments for touchHLE (e.g. "--scale-hack=2")
        type: string
        required: false
        default: ""
      tap_at:
        description: 'Seconds at which to tap the screen, comma-separated (e.g. "60,90")'
        type: string
        required: false
        default: ""
      tap_xy:
        description: 'Where to tap, as "x,y" in screen pixels; defaults to the centre'
        type: string
        required: false
        default: ""
      disassemble:
        description: Guest addresses from the log to disassemble, comma-separated hex
        type: string
        required: false
        default: ""
      xref:
        description: Guest addresses to find the code that reads or writes them, comma-separated hex
        type: string
        required: false
        default: ""
      callchain:
        description: One guest address to walk upwards from, finding who calls it
        type: string
        required: false
        default: ""
      find_string:
        description: Text shown on screen; finds it in the binary and the code that forms it
        type: string
        required: false
        default: ""
      dump_classes:
        description: Objective-C class names (or parts of them) to dump, comma-separated; "all" lists every class
        type: string
        required: false
        default: ""
      list_files:
        description: 'Case-insensitive substrings, comma-separated; lists matching bundle entries. Use "*" for a layout overview'
        type: string
        required: false
        default: ""
      cat_file:
        description: Path inside the bundle of a small text file to print, e.g. subheaps.xml
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  run-guest-app:
    name: Run on Linux
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.log_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          ref: ${{ inputs.build_ref }}

      - name: Report the revision under test
        run: git log -1 --format='%H %s'

      - name: Install Linux build and runtime dependencies
        # SDL2 and openal-soft are built from source, so the development
        # headers for the backends they detect must be available. `xvfb`
        # provides a headless X server and `libgl1-mesa-dri` the llvmpipe
        # software renderer, since the runner has no GPU.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dri \
            imagemagick \
            xdotool \
            xvfb

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download and extract Boost
        run: |
          curl -L --retry 4 --retry-delay 2 -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          mkdir -p vendor
          tar xzf boost_1_81_0.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build touchHLE
        run: cargo build --release

      # An app is often a couple of gigabytes, and triage means running the
      # same one over and over. Keep it between runs, both to save the twenty
      # minutes and to stop pulling it from wherever it is hosted every time.
      # The key is the hash of the link, so triaging the same app over many
      # runs means pasting the same link every time, and a link that has since
      # expired means no run at all even though the app is sitting in the
      # cache. app_cache_key names that entry directly; the run log of any
      # earlier run of this workflow has it.
      - name: Identify the app
        id: app
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_CACHE_KEY: ${{ inputs.app_cache_key }}
        run: |
          set -eu
          if [ -n "$APP_CACHE_KEY" ]; then
            key=${APP_CACHE_KEY#guest-app-}
          else
            key=$(printf '%s' "$APP_URL" | sha256sum | cut -c1-32)
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Try to get a cached copy of the app
        id: cache-app
        uses: actions/cache@main
        with:
          path: downloaded_app
          key: guest-app-${{ steps.app.outputs.key }}

      - if: ${{ steps.cache-app.outputs.cache-hit != 'true' }}
        name: Download the app
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ]; then
            echo "The cache does not hold that app and no app_url was given," \
                 "so there is nothing to run." >&2
            exit 1
          fi
          mkdir -p downloaded_app
          url=$APP_URL
          # An archive.org item page is not a file. Ask the metadata API which
          # files the item holds and take the first .ipa.
          case "$url" in
            *archive.org/details/*)
              identifier=${url##*/details/}
              identifier=${identifier%%/*}
              identifier=${identifier%%\?*}
              echo "Resolving archive.org item $identifier"
              curl -fL --retry 4 --retry-delay 2 \
                -o metadata.json "https://archive.org/metadata/$identifier"
              # An item that does not exist is not an error to the metadata
              # API, it is an empty object. Say which of the two happened.
              url=$(python3 -c 'import json, sys, urllib.parse; meta = json.load(open("metadata.json")); sys.exit("archive.org has no item named " + sys.argv[1]) if not meta else None; names = [f["name"] for f in meta.get("files", []) if f.get("name", "").lower().endswith(".ipa")]; sys.exit("No .ipa among the files of " + sys.argv[1]) if not names else None; print("https://archive.org/download/" + sys.argv[1] + "/" + urllib.parse.quote(names[0]))' "$identifier")
              ;;
          esac
          echo "Downloading $url"
          # An app can be a couple of gigabytes, and a transfer that stalls
          # part-way through would otherwise hold the job until it times out.
          # Give up on anything slower than 8 KiB/s for a minute and retry.
          curl -fL --retry 6 --retry-delay 5 --retry-all-errors \
            --speed-limit 8192 --speed-time 60 \
            -o downloaded_app/app.ipa "$url"
          ls -lh downloaded_app/app.ipa

      - name: Inspect the app bundle
        run: |
          set -euo pipefail
          ./target/release/touchHLE downloaded_app/app.ipa --info
          # Apps gate startup work on their own Info.plist — the supported
          # orientations in particular — so show what this one declares.
          python3 - <<'PY'
          import plistlib, zipfile

          with zipfile.ZipFile("downloaded_app/app.ipa") as ipa:
              name = next(
                  n for n in ipa.namelist()
                  if n.count("/") == 2 and n.endswith(".app/Info.plist")
              )
              info = plistlib.loads(ipa.read(name))
          # DT* and MinimumOSVersion say which SDK the app was built
          # against, which decides UIKit behaviour it depends on — screen
          # bounds became interface-oriented for apps linked against iOS 8,
          # for one — so they belong here next to what the app asks for.
          print("===== Info.plist (UI*, CFBundle*, DT* and version keys) =====")
          for key in sorted(info):
              if key.startswith(("UI", "CFBundle", "DT")) or key in (
                  "MinimumOSVersion",
                  "LSRequiresIPhoneOS",
                  "LSApplicationCategoryType",
              ):
                  print("{} = {!r}".format(key, info[key]))
          PY

      # When an app asks for a file and does not get it, the question is
      # whether the file is absent, spelled differently, or somewhere else in
      # the bundle. Only the bundle can answer that.
      - name: List the bundle entries matching a substring
        if: ${{ inputs.list_files != '' }}
        env:
          PATTERN: ${{ inputs.list_files }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, os, zipfile

          with zipfile.ZipFile("downloaded_app/app.ipa") as ipa:
              entries = ipa.infolist()

          total = sum(i.file_size for i in entries)
          print("===== bundle: {} entries, {:.1f} MiB uncompressed =====".format(
              len(entries), total / (1024 * 1024)))

          def show(matching, heading):
              # A directory of thousands would drown the log and say nothing
              # the count does not.
              print("--- {}: {} ---".format(heading, len(matching)))
              for entry in sorted(matching, key=lambda i: -i.file_size)[:60]:
                  print("{:>12}  {}".format(entry.file_size, entry.filename))
              if len(matching) > 60:
                  print("... and {} more (largest shown first)".format(len(matching) - 60))

          for pattern in os.environ["PATTERN"].split(","):
              pattern = pattern.strip().lower()
              if not pattern:
                  continue
              if pattern == "*":
                  # What sits at the top of the .app, and how big each subtree
                  # is: enough to tell an app that carries its data from one
                  # that expects to download it.
                  subtrees = collections.Counter()
                  sizes = collections.Counter()
                  for entry in entries:
                      parts = entry.filename.split("/")
                      top = "/".join(parts[:3]) if len(parts) > 3 else entry.filename
                      subtrees[top] += 1
                      sizes[top] += entry.file_size
                  print("--- top of the bundle: {} entries ---".format(len(subtrees)))
                  for name, size in sizes.most_common(60):
                      print("{:>12}  {:>6} entries  {}".format(size, subtrees[name], name))
                  continue
              show([i for i in entries if pattern in i.filename.lower()], repr(pattern))
          PY

      # A configuration file the app reads decides what the app then does.
      # When it has stopped somewhere, what that file told it is part of the
      # question, and it is not visible from the outside.
      - name: Print a text file from the bundle
        if: ${{ inputs.cat_file != '' }}
        env:
          CAT_FILE: ${{ inputs.cat_file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile

          wanted = os.environ["CAT_FILE"].lower().lstrip("/")
          with zipfile.ZipFile("downloaded_app/app.ipa") as ipa:
              names = [n for n in ipa.namelist() if n.lower().endswith(wanted)]
              if not names:
                  print("no bundle entry ends with {!r}".format(wanted))
              for name in names[:4]:
                  data = ipa.read(name)
                  print("===== {} ({} bytes) =====".format(name, len(data)))
                  # Printing a binary would fill the log with noise, and a
                  # large text file would too.
                  if len(data) > 64 * 1024:
                      print("(too large to print: {} bytes)".format(len(data)))
                  elif b"\0" in data:
                      print("(not text: contains NUL bytes)")
                  else:
                      print(data.decode("utf-8", "replace"))
          PY

      - name: Run the app under touchHLE
        shell: bash
        env:
          RUN_SECONDS: ${{ inputs.run_seconds }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
          TAP_SECONDS: ${{ inputs.tap_at }}
          TAP_XY: ${{ inputs.tap_xy }}
        run: |
          set -uo pipefail
          # Big enough for a landscape iPad window (1024x768) as well as a
          # portrait phone one; a screen smaller than the app's window clips
          # the screenshot and makes a working renderer look broken.
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            ./dev-scripts/ci-run-app.sh ./target/release/touchHLE \
            "${RUN_SECONDS}" downloaded_app/app.ipa ${EXTRA_ARGS}

      # A log can say the render loop is alive while every frame it presents is
      # black. Only the pixels settle that, so measure them.
      - name: Describe what was on screen
        if: ${{ always() }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          shots=(screenshot-*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "no screenshots were taken"
            exit 0
          fi
          echo "===== what was on screen ====="
          for shot in "${shots[@]}"; do
            # Mean brightness says whether anything was drawn at all; the
            # number of distinct colours says whether it was a picture or a
            # single flat fill.
            mean=$(identify -format '%[fx:int(mean*255)]' "$shot" 2>/dev/null || echo '?')
            sd=$(identify -format '%[fx:int(standard_deviation*255)]' "$shot" 2>/dev/null || echo '?')
            colours=$(identify -format '%k' "$shot" 2>/dev/null || echo '?')
            size=$(identify -format '%wx%h' "$shot" 2>/dev/null || echo '?')
            echo "$shot: $size, mean brightness $mean/255, std dev $sd, $colours distinct colours"
          done
          # The artifact is the good copy, but the artifact store is not
          # reachable from everywhere this log is read. A downscaled PNG,
          # base64'd, travels wherever the log does.
          last=$(ls screenshot-final.png 2>/dev/null || ls screenshot-*.png | tail -1)
          if [ -n "$last" ]; then
            convert "$last" -resize 320x480 -strip inline.png
            echo "===== $last, downscaled, as base64 png ====="
            base64 -w 120 inline.png
            echo "===== end of base64 png ====="
          fi

      - name: Upload the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@main
        with:
          name: guest_app_screenshots
          path: screenshot-*.png
          if-no-files-found: ignore

      # An address in the log — the LR of an ignored UndefinedInstruction, say
      # — says nothing on its own. This shows the guest instructions around it.
      - name: Disassemble the guest around the reported addresses
        if: ${{ always() && inputs.disassemble != '' }}
        env:
          ADDRESSES: ${{ inputs.disassemble }}
        run: |
          # Without pipefail the `| tee` below would swallow a failure of
          # the script and report the step as having succeeded.
          set -euo pipefail
          case "$ADDRESSES" in
            *[!0-9a-fA-FxX,\ ]*)
              echo "Addresses must be hexadecimal, separated by commas." >&2
              exit 2
              ;;
          esac
          python3 -m pip install --quiet capstone \
            || python3 -m pip install --quiet --break-system-packages capstone
          # Into a file as well as the log: the job's own output is buried
          # under the emulator's, and the report job prints this.
          # shellcheck disable=SC2046
          python3 dev-scripts/disassemble-guest.py downloaded_app/app.ipa \
            $(printf '%s' "$ADDRESSES" | tr ',' ' ') | tee disassembly.txt

      # The other direction: given a global that turned out to be zero, find
      # the code that is supposed to fill it in.
      - name: Find the code that references the given addresses
        if: ${{ always() && inputs.xref != '' }}
        env:
          ADDRESSES: ${{ inputs.xref }}
        run: |
          set -euo pipefail
          case "$ADDRESSES" in
            *[!0-9a-fA-FxX,\ ]*)
              echo "Addresses must be hexadecimal, separated by commas." >&2
              exit 2
              ;;
          esac
          python3 -m pip install --quiet capstone \
            || python3 -m pip install --quiet --break-system-packages capstone
          # Appended to the same file the report job prints.
          # shellcheck disable=SC2046
          python3 dev-scripts/disassemble-guest.py --xref downloaded_app/app.ipa \
            $(printf '%s' "$ADDRESSES" | tr ',' ' ') | tee -a disassembly.txt

      # And the whole path at once, rather than one dispatch per level.
      - name: Walk the call graph upwards from the given address
        if: ${{ always() && inputs.callchain != '' }}
        env:
          ADDRESS: ${{ inputs.callchain }}
        run: |
          set -euo pipefail
          case "$ADDRESS" in
            *[!0-9a-fA-FxX]*)
              echo "The address must be hexadecimal." >&2
              exit 2
              ;;
          esac
          python3 -m pip install --quiet capstone \
            || python3 -m pip install --quiet --break-system-packages capstone
          python3 dev-scripts/disassemble-guest.py --callchain downloaded_app/app.ipa \
            "$ADDRESS" | tee -a disassembly.txt

      # An app that has stopped is usually showing something, and the words it
      # shows are in its binary. This is the way in when the log names no
      # address worth disassembling.
      - name: Find the text on screen in the binary, and the code that forms it
        if: ${{ always() && inputs.find_string != '' }}
        env:
          NEEDLE: ${{ inputs.find_string }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet capstone \
            || python3 -m pip install --quiet --break-system-packages capstone
          python3 dev-scripts/disassemble-guest.py --string downloaded_app/app.ipa \
            "$NEEDLE" | tee -a disassembly.txt

      # An app's own classes are the part of it the emulator's log names but
      # cannot explain. This turns a selector from an --trace-objc run into
      # the address of the method that implements it.
      - name: Dump the app's Objective-C classes
        if: ${{ always() && inputs.dump_classes != '' }}
        env:
          CLASSES: ${{ inputs.dump_classes }}
        run: |
          set -euo pipefail
          case "$CLASSES" in
            *[!0-9a-zA-Z_,\ ]*)
              echo "Class names must be alphanumeric, separated by commas." >&2
              exit 2
              ;;
          esac
          python3 -m pip install --quiet capstone \
            || python3 -m pip install --quiet --break-system-packages capstone
          # "all" is a name in the list rather than a mode of its own, so a
          # single dispatch can both find out what the app is made of and
          # dump the classes already known to matter.
          names=$(printf '%s' "$CLASSES" | tr ',' ' ')
          rest=""
          for name in $names; do
            if [ "$name" = "all" ]; then
              python3 dev-scripts/disassemble-guest.py --class-list \
                downloaded_app/app.ipa | tee -a disassembly.txt
            else
              rest="$rest $name"
            fi
          done
          if [ -n "$rest" ]; then
            # shellcheck disable=SC2086
            python3 dev-scripts/disassemble-guest.py --class downloaded_app/app.ipa \
              $rest | tee -a disassembly.txt
          fi

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@main
        with:
          name: guest_app_run_log
          path: |
            run.log
            disassembly.txt
          if-no-files-found: ignore

  # An artifact has to be downloaded to be read, which is awkward when all you
  # want is to see what the emulator said. This job prints the log into the
  # workflow's own output, either for the run that just happened or, with
  # `log_run_id`, for an earlier one.
  report:
    name: Report the log
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: run-guest-app
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fetch the log
        uses: actions/download-artifact@main
        with:
          name: guest_app_run_log
          run-id: ${{ inputs.log_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Print the log
        run: |
          set -eu
          # A run that fell over before starting the emulator has no
          # run.log, and the disassembly is then the only thing there is to
          # show. Reporting nothing at all because of that would hide it.
          if [ ! -f run.log ]; then
            echo "No run.log in the artifact: the run never reached the emulator."
          else
          lines=$(wc -l < run.log)
          echo "run.log: $lines lines"
          echo
          if [ "$lines" -le 900 ]; then
            echo "===== full log ====="
            cat run.log
          else
            echo "===== first 200 lines ====="
            head -200 run.log
            echo "===== last 300 lines ====="
            tail -300 run.log
          fi
          echo
          # An `--trace-objc` run puts what the app actually did in the
          # middle of the log, which is the part the head/tail above drops.
          if grep -aq 'objc trace:' run.log; then
            echo "===== objc trace (first 400 lines) ====="
            grep -a 'objc trace:' run.log | head -400
            echo "===== objc trace: how often each message was sent ====="
            grep -a 'objc trace:' run.log \
              | sed -E 's/ 0x[0-9a-fA-F]+>/>/' \
              | sort | uniq -c | sort -rn | head -60
            echo
          fi
          # These two go last, so that they are what you see first when
          # reading the job output from the end.
          echo "===== what led up to the first null-page access ====="
          first=$(grep -an 'NULL-PAGE' run.log | head -1 | cut -d: -f1 || true)
          if [ -n "${first:-}" ]; then
            start=1
            if [ "$first" -gt 80 ]; then start=$((first - 80)); fi
            sed -n "${start},${first}p" run.log
          else
            echo "(none)"
          fi
          echo
          echo "===== warnings, with addresses and counters folded together ====="
          grep -aE 'Warning|TODO|nimplemented|not implemented|error|Error|missing' run.log \
            | sed -E 's/0x[0-9a-fA-F]+/0xX/g; s/[0-9]+/N/g' \
            | sort | uniq -c | sort -rn | head -60 || true
          echo
          # The table above folds addresses together, which is what makes it
          # readable and also what makes it useless for looking anything up.
          # These are the addresses themselves, ready for
          # dev-scripts/disassemble-guest.py.
          echo "===== guest addresses the emulator named ====="
          grep -aoE '(called from|return to LR \(|UndefinedInstruction at) ?0x[0-9a-fA-F]+' run.log \
            | sort -u || true
          fi
          if [ -f disassembly.txt ]; then
            echo
            echo "===== disassembly around the requested addresses ====="
            cat disassembly.txt
          fi
